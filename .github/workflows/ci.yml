name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build solution
        run: dotnet build XComfortNet.sln --configuration Release
      - name: Run tests
        run: dotnet test XComfortNet.sln --configuration Release --no-build
      - name: Build Docker image
        run: docker build --tag xcomfort2mqtt:ci .
