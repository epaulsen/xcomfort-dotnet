services:
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1::1883"
    volumes:
      - ./test/XComfortNet.AppHost/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/version' -C 1 -W 5 >/dev/null"]
      interval: 10s
      timeout: 6s
      retries: 5

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - ./test/XComfortNet.AppHost/homeassistant:/config
    depends_on:
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  xcomfort2mqtt:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Mqtt__Host: mqtt
      Mqtt__Port: "1883"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ./src/XComfortNet.Web/appsettings.Development.json
        target: /app/appsettings.Development.json
        read_only: true
        bind:
          create_host_path: false
      - xcomfort-data:/app/data
    depends_on:
      mqtt:
        condition: service_healthy

volumes:
  mqtt-data:
  xcomfort-data:
