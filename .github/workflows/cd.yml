name: CD

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  push:
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: epaulsen/xcomfort2mqtt

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.deleted != true) || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - name: Validate Git tag
        if: github.ref_type == 'tag'
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::Git tag is not a valid Docker tag: $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Build Docker image
        run: |
          docker build --tag "$IMAGE:$GITHUB_RUN_ID" --tag "$IMAGE:latest" .
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            docker tag "$IMAGE:$GITHUB_RUN_ID" "$IMAGE:$GITHUB_REF_NAME"
          fi
      - name: Save Docker image
        run: |
          tags=("$IMAGE:$GITHUB_RUN_ID" "$IMAGE:latest")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tags+=("$IMAGE:$GITHUB_REF_NAME")
          fi
          docker save --output "$RUNNER_TEMP/image.tar" "${tags[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ${{ runner.temp }}/image.tar
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: dockerhub
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: ${{ runner.temp }}
      - name: Load Docker image
        run: docker load --input "$RUNNER_TEMP/image.tar"
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: epaulsen
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push Docker image
        run: |
          docker push "$IMAGE:$GITHUB_RUN_ID"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            docker push "$IMAGE:$GITHUB_REF_NAME"
          fi
          docker push "$IMAGE:latest"
